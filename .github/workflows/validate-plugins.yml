name: Validate marketplace artifacts

on:
  pull_request:
    paths:
      - README.md
      - plugins.json
      - .agents/plugins/marketplace.json
      - plugins/**
      - scripts/generate_plugins_json.py
  push:
    branches: [main]
    paths:
      - README.md
      - plugins.json
      - .agents/plugins/marketplace.json
      - plugins/**
      - scripts/generate_plugins_json.py

permissions:
  contents: read
  id-token: none

jobs:
  sync:
    name: Validate marketplace artifacts with README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated catalog consistency (no writes)
        run: |
          python3 scripts/generate_plugins_json.py
          if ! git diff --quiet -- plugins.json .agents/plugins/marketplace.json plugins; then
            echo "::notice::marketplace artifacts were out of sync"
            echo "Generated artifacts differ; update them in a reviewed source commit."
            git diff --stat -- plugins.json .agents/plugins/marketplace.json plugins
            exit 1
          else
            echo "marketplace artifacts are up to date"
          fi
