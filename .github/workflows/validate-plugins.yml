name: Validate marketplace artifacts

on:
  pull_request:
    paths:
      - README.md
      - plugins.json
      - .agents/plugins/marketplace.json
      - plugins/**
      - scripts/generate_plugins_json.py
      - scripts/check_catalog_snapshot.py
      - tests/test_catalog_snapshot.py
      - tests/test_reviewed_normalization.py
  push:
    branches: [main]
    paths:
      - README.md
      - plugins.json
      - .agents/plugins/marketplace.json
      - plugins/**
      - scripts/generate_plugins_json.py
      - scripts/check_catalog_snapshot.py
      - tests/test_catalog_snapshot.py
      - tests/test_reviewed_normalization.py

permissions:
  contents: read
  id-token: none

jobs:
  sync:
    name: Validate marketplace artifacts with README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test snapshot and refresh validation
        run: python3 -m unittest discover -s tests -v
      - name: Check committed catalog consistency (offline, no writes)
        run: python3 scripts/check_catalog_snapshot.py
