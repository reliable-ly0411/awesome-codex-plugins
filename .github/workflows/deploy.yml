name: Build site candidate (manual, no publication)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source commit to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-site-build-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve trusted packaging tool
        run: cp .github/automation/site_artifact.py "$RUNNER_TEMP/site_artifact.py"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate links and build site
        run: |
          npx --yes markdown-link-check@3.15.0 README.md --config .mlc_deploy_config.json
          node build.js
          test -s dist/index.html
      - name: Package original site bytes and provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 "$RUNNER_TEMP/site_artifact.py" package dist
      - uses: actions/upload-artifact@v4
        with:
          name: site-candidate
          path: ${{ runner.temp }}/site-candidate/
          if-no-files-found: error
          retention-days: 30
